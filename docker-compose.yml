services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./ml/artifacts:/app/ml/artifacts
    environment:
      DATA_DIR: /app/data
      ML_ARTIFACTS_DIR: /app/ml/artifacts
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: INFO

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    command: sh -c "npm ci && npx vite --host 0.0.0.0 --port 3000"
    depends_on:
      - api
