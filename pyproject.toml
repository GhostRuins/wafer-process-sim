[project]
name = "wafer-sim"
version = "0.1.0"
description = "CVD wafer process simulation and synthetic dataset generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27", "pytest-asyncio>=0.23", "asgi-lifespan>=2.0"]
ml = [
  "scikit-learn>=1.3",
  "lightgbm>=4.0",
  "xgboost>=2.0",
  "optuna>=3.5",
  "shap>=0.44",
  "matplotlib>=3.8",
  "pydantic>=2.0",
  "joblib>=1.3",
]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "polars>=0.20",
  "loguru>=0.7",
  "pydantic>=2.0",
]

[tool.setuptools.packages.find]
include = ["wafer_sim*", "ml*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
